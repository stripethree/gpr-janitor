name: Verify distribution bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Ensure dist is committed
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is out of date. Run npm run build and commit dist/."
            git status --porcelain dist
            exit 1
          fi
